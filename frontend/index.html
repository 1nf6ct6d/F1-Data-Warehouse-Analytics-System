<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 Analytics Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>F1 Analytics Demo</h1>
      <p>Oracle DWH + FastAPI demo frontend</p>
    </header>

    <section class="card">
      <h2>Driver Points</h2>
      <button id="load-driver-points">Load Driver Points</button>
      <div id="driver-points-table"></div>
    </section>

    <section class="card">
      <h2>Constructor Points</h2>
      <button id="load-constructor-points">Load Constructor Points</button>
      <div id="constructor-points-table"></div>
    </section>

    <section class="card">
      <h2>Driver Podiums</h2>
      <button id="load-driver-podiums">Load Driver Podiums</button>
      <div id="driver-podiums-table"></div>
    </section>

    <section class="card">
      <h2>Race Results</h2>
      <div class="filters">
        <label>
          Season
          <input type="number" id="season-input" value="2023" min="2000" max="2100" />
        </label>
        <label>
          Round
          <input type="number" id="round-input" value="1" min="1" max="30" />
        </label>
        <button id="load-race-results">Load Race Results</button>
      </div>
      <div id="race-results-table"></div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
