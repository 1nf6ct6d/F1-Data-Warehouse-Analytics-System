services:
  minio:
    image: minio/minio:latest
    container_name: f1-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../../.env
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  minio_data: