services:
  minio:
    image: minio/minio:latest
    container_name: f1-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../../.env
    volumes:
      - minio_data:/data
    restart: unless-stopped

  oracle:
    image: gvenzl/oracle-free:23.5-slim-faststart
    container_name: f1-oracle
    ports:
      - "1521:1521"
    env_file:
      - ./oracle.env
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: unless-stopped

  airflow-webserver:
    build:
      context: ../../
      dockerfile: infra/docker/airflow.Dockerfile
    container_name: f1-airflow-webserver
    depends_on:
      - airflow-scheduler
      - oracle
    env_file:
      - ../../.env
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      ORACLE_HOST: oracle
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ../../airflow:/opt/airflow
      - ../../:/opt/project
    ports:
      - "8088:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: ../../
      dockerfile: infra/docker/airflow.Dockerfile
    container_name: f1-airflow-scheduler
    depends_on:
      - oracle
    env_file:
      - ../../.env
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      ORACLE_HOST: oracle
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ../../airflow:/opt/airflow
      - ../../:/opt/project
    command: scheduler
    restart: unless-stopped
  
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: f1-clickhouse
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      CLICKHOUSE_DB: f1_serving
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: unless-stopped

volumes:
  minio_data:
  oracle_data:
  clickhouse_data: